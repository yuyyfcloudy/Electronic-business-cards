<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>填写资料</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
<h1>📝 创建我的电子名片</h1>
<p style="margin-bottom:25px;color:#888;">填写信息，生成你的专属名片</p>

<input id="name" placeholder="姓名">
<input id="job" placeholder="职位">
<textarea id="intro" placeholder="个人介绍"></textarea>
<input id="phone" placeholder="电话号码">
<input id="email" placeholder="邮箱">
<input id="github" placeholder="GitHub 链接">
<textarea id="honor_text" placeholder="个人荣誉（如：2024年优秀毕业生、ACM铜奖等）"></textarea>
<label class="file-upload">
    <input type="file" id="honor_image" accept="image/*" multiple onchange="updateFileName(this, 'honorFileName')">
    <span class="file-btn">🏆 荣誉图片</span>
    <span class="file-name" id="honorFileName">未选择文件（最多6张）</span>
</label>

<label class="file-upload">
    <input type="file" id="avatar" accept="image/*" onchange="updateFileName(this)">
    <span class="file-btn">📷 选择头像</span>
    <span class="file-name" id="fileName">未选择文件</span>
</label>

<div class="privacy-section">
    <div class="privacy-title">🔒 隐私设置</div>
    <p class="privacy-hint">勾选后，对应信息在名片广场中不可见</p>
    <div class="privacy-grid">
        <label class="privacy-item"><input type="checkbox" data-field="name" class="hide-check"> 姓名</label>
        <label class="privacy-item"><input type="checkbox" data-field="job" class="hide-check"> 职位</label>
        <label class="privacy-item"><input type="checkbox" data-field="intro" class="hide-check"> 个人介绍</label>
        <label class="privacy-item"><input type="checkbox" data-field="phone" class="hide-check"> 电话</label>
        <label class="privacy-item"><input type="checkbox" data-field="email" class="hide-check"> 邮箱</label>
        <label class="privacy-item"><input type="checkbox" data-field="github" class="hide-check"> GitHub</label>
        <label class="privacy-item"><input type="checkbox" data-field="honor_text" class="hide-check"> 荣誉文字</label>
        <label class="privacy-item"><input type="checkbox" data-field="honor_image" class="hide-check"> 荣誉图片</label>
    </div>
    <div class="privacy-divider"></div>
    <label class="privacy-all">
        <input type="checkbox" id="hideAllCard"> 🙈 全部隐藏（名片广场中隐藏整张名片）
    </label>
    <div class="privacy-quick-actions">
        <button onclick="hideAllFields()" style="background:linear-gradient(135deg, #ff6b6b, #ee5a5a);">🙈 全选隐藏</button>
        <button onclick="showAllFields()" style="background:linear-gradient(135deg, #51cf66, #40c057);">👁️ 全部显示</button>
    </div>
</div>

<div style="display:flex;gap:12px;margin-top:15px;">
    <button onclick="saveProfile()" style="flex:1;">💾 保存修改</button>
    <button onclick="clearProfile()" style="flex:1;background:linear-gradient(135deg, #ff6b6b, #ee5a5a);">🗑️ 清空</button>
</div>

</div>

<script type="module" src="script.js"></script>

<script type="module">
import { supabase } from "./supabase.js";

(async function(){
    const { data: userData } = await supabase.auth.getUser();
    if(!userData.user) return;

    const { data } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", userData.user.id)
        .maybeSingle();

    if(data){
        document.getElementById("name").value = data.name || "";
        document.getElementById("job").value = data.job || "";
        document.getElementById("intro").value = data.intro || "";
        document.getElementById("phone").value = data.phone || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("github").value = data.github || "";
        document.getElementById("honor_text").value = data.honor_text || "";

        // —— 严格恢复隐私设置：支持数组和 JSON 字符串两种格式 ——
        let savedHiddenFields = [];
        if (data.hidden_fields) {
            if (Array.isArray(data.hidden_fields)) {
                savedHiddenFields = data.hidden_fields;
            } else if (typeof data.hidden_fields === 'string') {
                try { savedHiddenFields = JSON.parse(data.hidden_fields) || []; }
                catch(e) { savedHiddenFields = []; }
                if (!Array.isArray(savedHiddenFields)) savedHiddenFields = [];
            }
        }
        savedHiddenFields.forEach(field => {
            const cb = document.querySelector(`.hide-check[data-field="${field}"]`);
            if (cb) cb.checked = true;
        });

        // —— 严格恢复「全部隐藏」：仅当值确实是 true 或字符串 "true" 时才勾选 ——
        const isHidden = (data.is_hidden === true) || (String(data.is_hidden).toLowerCase() === "true");
        document.getElementById("hideAllCard").checked = isHidden;

        if(data.honor_image){
            try {
                const arr = JSON.parse(data.honor_image);
                if(Array.isArray(arr) && arr.length > 0){
                    document.getElementById("honorFileName").textContent = "已上传 " + arr.length + " 张荣誉图片";
                    document.getElementById("honorFileName").style.color = "#667eea";
                }
            } catch(e) {
                document.getElementById("honorFileName").textContent = "已上传 1 张荣誉图片";
                document.getElementById("honorFileName").style.color = "#667eea";
            }
        }
    }
})();

window.hideAllFields = function(){
    document.querySelectorAll('.hide-check').forEach(cb => cb.checked = true);
    document.getElementById("hideAllCard").checked = true;
};
window.showAllFields = function(){
    document.querySelectorAll('.hide-check').forEach(cb => cb.checked = false);
    document.getElementById("hideAllCard").checked = false;
};

</script>

</body>
</html>
