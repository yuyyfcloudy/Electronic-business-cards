<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>填写资料</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
<h1>📝 创建我的电子名片</h1>
<p style="margin-bottom:25px;color:#888;">填写信息，生成你的专属名片</p>

<input id="name" placeholder="姓名">
<input id="job" placeholder="职位">
<textarea id="intro" placeholder="个人介绍"></textarea>
<input id="phone" placeholder="电话号码">
<input id="email" placeholder="邮箱">
<input id="github" placeholder="GitHub 链接">
<textarea id="honor_text" placeholder="个人荣誉（如：2024年优秀毕业生、ACM铜奖等）"></textarea>
<label class="file-upload">
    <input type="file" id="honor_image" accept="image/*" multiple onchange="updateFileName(this, 'honorFileName')">
    <span class="file-btn">🏆 荣誉图片</span>
    <span class="file-name" id="honorFileName">未选择文件（最多6张）</span>
</label>

<label class="file-upload">
    <input type="file" id="avatar" accept="image/*" onchange="updateFileName(this)">
    <span class="file-btn">📷 选择头像</span>
    <span class="file-name" id="fileName">未选择文件</span>
</label>

<div style="display:flex;gap:12px;margin-top:15px;">
    <button onclick="saveProfile()" style="flex:1;">💾 保存修改</button>
    <button onclick="clearProfile()" style="flex:1;background:linear-gradient(135deg, #ff6b6b, #ee5a5a);">🗑️ 清空</button>
</div>

</div>

<script type="module" src="script.js"></script>

<script type="module">
import { supabase } from "./supabase.js";

(async function(){
    const { data: userData } = await supabase.auth.getUser();
    if(!userData.user) return;

    const { data } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", userData.user.id)
        .maybeSingle();

    if(data){
        document.getElementById("name").value = data.name || "";
        document.getElementById("job").value = data.job || "";
        document.getElementById("intro").value = data.intro || "";
        document.getElementById("phone").value = data.phone || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("github").value = data.github || "";
        document.getElementById("honor_text").value = data.honor_text || "";

        if(data.honor_image){
            try {
                const arr = JSON.parse(data.honor_image);
                if(Array.isArray(arr) && arr.length > 0){
                    document.getElementById("honorFileName").textContent = "已上传 " + arr.length + " 张荣誉图片";
                    document.getElementById("honorFileName").style.color = "#667eea";
                }
            } catch(e) {
                document.getElementById("honorFileName").textContent = "已上传 1 张荣誉图片";
                document.getElementById("honorFileName").style.color = "#667eea";
            }
        }
    }
})();
</script>

</body>
</html>
