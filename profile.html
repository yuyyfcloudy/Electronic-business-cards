<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>填写资料</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="box">
<h1>📝 创建我的电子名片</h1>
<p style="margin-bottom:25px;color:#888;">填写信息，生成你的专属名片</p>
<input id="name" placeholder="姓名">
<input id="job" placeholder="职位">
<textarea id="intro" placeholder="个人介绍"></textarea>
<input id="phone" placeholder="电话号码">
<input id="email" placeholder="邮箱">
<input id="github" placeholder="GitHub 链接">
<label class="file-upload">
    <input type="file" id="avatar" accept="image/*" onchange="updateFileName(this)">
    <span class="file-btn">📷 选择头像</span>
    <span class="file-name" id="fileName">未选择文件</span>
</label>
<button onclick="saveProfile()">保存名片</button>
</div>
<script type="module" src="script.js"></script>
<script type="module">
import { supabase } from "./supabase.js";

(async function(){
    const { data: userData } = await supabase.auth.getUser();
    if(!userData.user) return;
    
    // 查询已有资料并填充
    const { data } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", userData.user.id)
        .maybeSingle();
    
    if(data){
        document.getElementById("name").value = data.name || "";
        document.getElementById("job").value = data.job || "";
        document.getElementById("intro").value = data.intro || "";
        document.getElementById("phone").value = data.phone || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("github").value = data.github || "";
        
	<div style="display:flex;gap:12px;margin-top:15px;">
	  <button onclick="saveProfile()" style="flex:1;">💾 保存修改</button>
  	  <button onclick="clearProfile()" style="flex:1;background:linear-gradient(135deg, #ff6b6b, #ee5a5a);">🗑️ 清空</button>
	</div>
    }
})();
</script>
</body>
</html>
