<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>填写资料</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>
创建我的电子名片
</h1>


<input 
id="name"
placeholder="姓名">


<input 
id="job"
placeholder="职位">


<textarea id="intro" placeholder="个人介绍"></textarea>



<input 
id="phone"
placeholder="电话号码">


<input 
id="email"
placeholder="邮箱">


<input 
id="github"
placeholder="GitHub链接">


<input type="file" id="avatar" accept="image/*">



<button onclick="saveProfile()">

保存名片

</button>



</div>




<script 
type="module"
src="script.js">

</script>


</body>

</html>
