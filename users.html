<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名片广场</title>
<link rel="stylesheet" href="style.css">

</head>
<body class="users-body">

<nav class="top-nav" style="position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(12,14,27,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);">
  <div class="nav-inner" style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;">
    <a href="home.html" class="nav-logo" style="font-size:18px;font-weight:700;color:#f1f5f9;text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:-0.3px;">📇 电子名片</a>
    <div class="nav-menu" style="display:flex;gap:8px;">
      <a href="home.html" class="nav-link" style="color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;font-weight:500;padding:8px 16px;border-radius:10px;transition:all 0.3s ease;">首页</a>
      <a href="users.html" class="nav-link active" style="color:#a78bfa;background:rgba(167,139,250,0.08);text-decoration:none;font-size:14px;font-weight:500;padding:8px 16px;border-radius:10px;transition:all 0.3s ease;">名片广场</a>
      <a href="#" class="nav-link" onclick="goToMyCard();return false;" style="color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;font-weight:500;padding:8px 16px;border-radius:10px;transition:all 0.3s ease;">个人名片</a>
    </div>
    <div class="nav-user" id="navUser" style="position:relative;">
      <div class="avatar-wrap" onclick="toggleUserMenu(event)" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border-radius:12px;transition:all 0.3s ease;">
        <img id="navAvatar" class="nav-avatar-img" src="" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(139,92,246,0.3);display:none;">
        <div id="navAvatarFallback" class="nav-avatar-fallback" style="width:36px;height:36px;border-radius:50%;background:rgba(139,92,246,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid rgba(139,92,246,0.2);">👤</div>
        <span class="nav-user-text" id="navUserText" style="font-size:13px;color:rgba(255,255,255,0.6);font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">登录</span>
      </div>
      <div class="user-dropdown" id="userDropdown" style="position:absolute;top:56px;right:0;background:rgba(26,29,58,0.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:8px;min-width:160px;box-shadow:0 20px 60px rgba(0,0,0,0.5);opacity:0;visibility:hidden;transform:translateY(-10px);transition:all 0.3s ease;">
        <a href="card.html" style="display:block;padding:10px 16px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;border-radius:10px;transition:all 0.2s;">我的名片</a>
        <a href="profile.html" style="display:block;padding:10px 16px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;border-radius:10px;transition:all 0.2s;">编辑资料</a>
        <div class="dropdown-divider" style="height:1px;background:rgba(255,255,255,0.06);margin:8px;"></div>
        <a href="#" onclick="doNavLogout();return false;" style="display:block;padding:10px 16px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;border-radius:10px;transition:all 0.2s;">退出登录</a>
      </div>
    </div>
  </div>
</nav>

<!-- 搜索栏 -->
<div style="max-width:1200px;margin:0 auto;padding:84px 40px 20px;text-align:right;">
  <input type="text" id="searchInput" placeholder="🔍 搜索姓名或职位..." 
         style="padding:10px 20px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8);width:260px;outline:none;font-size:14px;transition:all 0.3s;">
</div>

<header class="page-header">
    <h1>名片广场</h1>
    <p>发现优秀的电子名片，点击卡片查看完整信息</p>
</header>

<div class="grid" id="userList">
    <div class="loading-state">正在加载名片数据...</div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const list = document.getElementById("userList");
let currentUserId = null;
let allData = [];

document.getElementById("searchInput").addEventListener("input", (e) => {
    const keyword = e.target.value.toLowerCase().trim();
    if (!keyword) {
        render(allData);
        return;
    }
    const filtered = allData.filter(u => 
        (u.name || "").toLowerCase().includes(keyword) ||
        (u.job || "").toLowerCase().includes(keyword)
    );
    render(filtered);
});


// 维护已渲染卡片的映射：id -> { el, refs }
const cardMap = new Map();
let isFirstLoad = true;

// 获取有效头像 URL，空 / null / 纯空格 时不设置 src（显示空白占位）
function getAvatarUrl(raw) {
    if (raw && typeof raw === "string" && raw.trim().length > 0) {
        return raw.trim();
    }
    return "";
}

// 截断文本
function truncate(str, len) {
    if (!str) return "";
    str = String(str);
    return str.length > len ? str.slice(0, len) + "..." : str;
}

// 创建一张新卡片 DOM，返回 { el, refs }
function createCard(user, isNewEntry = false) {
    const card = document.createElement("div");
    const hiddenFields = user.hidden_fields || [];
    const isOwner = user.id === currentUserId;
    const shouldHideField = (field) => hiddenFields.includes(field) && !isOwner;
    card.className = "user-card";
    if (isNewEntry) {
        card.classList.add("card-enter");
    }
    card.dataset.id = user.id;
    card.onclick = () => { location.href = "card.html?id=" + encodeURIComponent(user.id); };

    // ===== 头部：头像 + 基本信息 =====
    const header = document.createElement("div");
    header.className = "card-header";

    const avatarWrap = document.createElement("div");
    avatarWrap.className = "card-avatar-wrap";

    const avatar = document.createElement("img");
    avatar.className = "card-avatar";
    avatar.alt = "头像";
    const avatarUrl = getAvatarUrl(user.avatar);
    if (avatarUrl) {
        avatar.src = avatarUrl;
        avatar.onerror = function() {
            this.src = "";
            this.style.background = "rgba(255,255,255,0.05)";
        };
    } else {
        avatar.style.background = "rgba(255,255,255,0.05)";
    }

    const statusDot = document.createElement("div");
    statusDot.className = "card-avatar-status";

    avatarWrap.appendChild(avatar);
    avatarWrap.appendChild(statusDot);

    const info = document.createElement("div");
    info.className = "card-info";

    const nameEl = document.createElement("h3");
    nameEl.className = "card-name";
    nameEl.textContent = shouldHideField('name') ? "已隐藏" : (user.name || "未命名");
    if(shouldHideField('name')) nameEl.style.opacity = "0.5";

    const jobEl = document.createElement("p");
    jobEl.className = "card-job";
    jobEl.textContent = shouldHideField('job') ? "已隐藏" : (user.job || "暂无职位");
    if(shouldHideField('job')) jobEl.style.opacity = "0.5";

    const idEl = document.createElement("span");
    idEl.className = "card-id";
    idEl.textContent = "ID: " + truncate(user.id, 12);

    info.appendChild(nameEl);
    info.appendChild(jobEl);
    info.appendChild(idEl);
    header.appendChild(avatarWrap);
    header.appendChild(info);

    // ===== 联系方式分区 =====
    const contacts = document.createElement("div");
    contacts.className = "card-contacts";

    const contactDefs = [
        { key: "phone", icon: "📞", label: "电话" },
        { key: "email", icon: "✉️", label: "邮箱" },
        { key: "github", icon: "💻", label: "GitHub" },
    ];

    const contactRefs = {};
    contactDefs.forEach(def => {
        const item = document.createElement("div");
        item.className = "contact-item";
        
        if(shouldHideField(def.key)) {
            item.classList.add("empty");
            const icon = document.createElement("span");
            icon.className = "icon";
            icon.textContent = def.icon;
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = def.label;
            const value = document.createElement("span");
            value.className = "value";
            value.textContent = "已隐藏";
            item.appendChild(icon);
            item.appendChild(label);
            item.appendChild(value);
            contacts.appendChild(item);
            contactRefs[def.key] = { item, value };
            return;
        }

        const val = user[def.key];
        if (!val) item.classList.add("empty");

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = def.icon;

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = def.label;

        const value = document.createElement("span");
        value.className = "value";
        value.textContent = val ? truncate(val, 16) : "未填写";

        item.appendChild(icon);
        item.appendChild(label);
        item.appendChild(value);
        contacts.appendChild(item);
        contactRefs[def.key] = { item, value };
    });


    // ===== 简介区 =====
    const bio = document.createElement("div");
    bio.className = "card-bio";

    const bioLabel = document.createElement("div");
    bioLabel.className = "card-bio-label";
    bioLabel.textContent = "关于我";

    const bioText = document.createElement("p");
    bioText.className = "card-bio-text";
    if(hiddenFields.includes('intro')) {
        bioText.classList.add("empty");
        bioText.textContent = "该用户已隐藏个人介绍";
    } else {
        const intro = user.intro;
        if (intro && String(intro).trim()) {
            bioText.textContent = String(intro).trim();
        } else {
            bioText.classList.add("empty");
            bioText.textContent = "这位用户还没有填写个人介绍...";
        }
    }

    bio.appendChild(bioLabel);
    bio.appendChild(bioText);

    // ===== 底部 =====
    const footer = document.createElement("div");
    footer.className = "card-footer";

    const footerText = document.createElement("span");
    footerText.className = "card-footer-text";
    footerText.textContent = "查看完整名片";

    const footerArrow = document.createElement("span");
    footerArrow.className = "card-footer-arrow";
    footerArrow.textContent = "→";

    footer.appendChild(footerText);
    footer.appendChild(footerArrow);

    // 组装
    card.appendChild(header);
    card.appendChild(contacts);
    card.appendChild(bio);
    card.appendChild(footer);

    // 缓存引用，方便 diff 更新
    const refs = {
        avatar,
        nameEl,
        jobEl,
        idEl,
        contactRefs,
        bioText,
    };

    return { el: card, refs };
}

// 更新已有卡片，只改动真正变化的数据
function updateCard(entry, user) {
    const { refs } = entry;
    const hiddenFields = normalizeHiddenFields(user.hidden_fields);
    const isOwner = user.id === currentUserId;
    const shouldHideField = (field) => hiddenFields.includes(field) && !isOwner;

    // 头像
    const newAvatar = getAvatarUrl(user.avatar);
    if (newAvatar) {
        if (refs.avatar.src !== newAvatar) {
            refs.avatar.src = newAvatar;
            refs.avatar.style.background = "";
        }
    } else {
        refs.avatar.src = "";
        refs.avatar.style.background = "rgba(255,255,255,0.05)";
    }

    // 姓名
    const newName = shouldHideField('name') ? "已隐藏" : (user.name || "未命名");
    if (refs.nameEl.textContent !== newName) {
        refs.nameEl.textContent = newName;
    }
    refs.nameEl.style.opacity = shouldHideField('name') ? "0.5" : "1";

    // 职位
    const newJob = shouldHideField('job') ? "已隐藏" : (user.job || "暂无职位");
    if (refs.jobEl.textContent !== newJob) {
        refs.jobEl.textContent = newJob;
    }
    refs.jobEl.style.opacity = shouldHideField('job') ? "0.5" : "1";

    // ID
    const newId = "ID: " + truncate(user.id, 12);
    if (refs.idEl.textContent !== newId) {
        refs.idEl.textContent = newId;
    }

    // 联系方式
    const contactDefs = [
        { key: "phone", icon: "📞", label: "电话" },
        { key: "email", icon: "✉️", label: "邮箱" },
        { key: "github", icon: "💻", label: "GitHub" },
    ];
    contactDefs.forEach(def => {
        const ref = refs.contactRefs[def.key];
        if(shouldHideField(def.key)) {
            const displayVal = "已隐藏";
            if(ref.value.textContent !== displayVal) {
                ref.value.textContent = displayVal;
            }
            ref.item.classList.add("empty");
        } else {
            const val = user[def.key];
            const displayVal = val ? truncate(val, 16) : "未填写";
            if(ref.value.textContent !== displayVal) {
                ref.value.textContent = displayVal;
            }
            if(val) {
                ref.item.classList.remove("empty");
            } else {
                ref.item.classList.add("empty");
            }
        }
    });

    // 简介
    if(shouldHideField('intro')) {
        const hiddenText = "该用户已隐藏个人介绍";
        if(refs.bioText.textContent !== hiddenText) {
            refs.bioText.textContent = hiddenText;
            refs.bioText.classList.add("empty");
        }
    } else {
        const intro = user.intro;
        if(intro && String(intro).trim()) {
            const newIntro = String(intro).trim();
            if(refs.bioText.textContent !== newIntro) {
                refs.bioText.textContent = newIntro;
                refs.bioText.classList.remove("empty");
            }
        } else {
            const emptyText = "这位用户还没有填写个人介绍...";
            if(refs.bioText.textContent !== emptyText) {
                refs.bioText.textContent = emptyText;
                refs.bioText.classList.add("empty");
            }
        }
    }

    entry.el.onclick = () => { location.href = "card.html?id=" + encodeURIComponent(user.id); };
}

// 核心渲染：diff 更新，绝不整体 innerHTML 覆盖
function render(data) {
    if (!data) data = [];

    const currentIds = new Set(data.map(u => u.id));

    // 1. 删除后端已不存在的卡片
    for (const [id, entry] of cardMap) {
        if (!currentIds.has(id)) {
            entry.el.remove();
            cardMap.delete(id);
        }
    }

    // 2. 按后端返回顺序，逐个更新 / 插入卡片
    data.forEach((user, index) => {
        const entry = cardMap.get(user.id);
        const refNode = list.children[index] || null;

        if (entry) {
            updateCard(entry, user);
            // 调整位置（如果顺序变了）
            if (refNode !== entry.el) {
                list.insertBefore(entry.el, refNode);
            }
        } else {
            const newEntry = createCard(user, !isFirstLoad);
            cardMap.set(user.id, newEntry);
            if (refNode) {
                list.insertBefore(newEntry.el, refNode);
            } else {
                list.appendChild(newEntry.el);
            }
        }
    });

    // 3. 首次加载且空数据时显示提示
    if (isFirstLoad && data.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📇</div><div class="empty-state-text">还没有人创建名片，快去创建第一张吧！</div></div>';
    }

    isFirstLoad = false;
}

// 拉取数据 — 查询全部字段
async function fetchData() {
	  const { data: authData } = await supabase.auth.getUser();
  	  currentUserId = authData.user ? authData.user.id : null;
 	  const { data, error } = await supabase
        .from("profiles")
        .select("id, name, job, avatar, phone, email, github, intro, hidden_fields, is_hidden");

    if (error) {
        console.error(error);
        if (isFirstLoad) {
            list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败: ' + error.message + '</div></div>';
        }
        return;
    }

	allData = (data || []).filter(u => !(u.is_hidden === true || u.is_hidden === "true"));
    
    // 如果搜索框有内容，保持当前搜索结果
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    if (keyword) {
        const filtered = allData.filter(u => 
            (u.name || "").toLowerCase().includes(keyword) ||
            (u.job || "").toLowerCase().includes(keyword)
        );
        render(filtered);
    } else {
        render(allData);
    }
}

// 首次加载
fetchData();

// 定时轮询，每 8 秒静默刷新一次
setInterval(fetchData, 8000);
</script>

<script type="module" src="script.js"></script>
</body>
</html>
