<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的电子名片</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="refined.css">
<link rel="stylesheet" href="secondary-polish.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="aurora.css">
<script defer src="secondary-motion.js"></script>
<script defer src="aurora.js"></script>
<script defer src="friends.js"></script>

</head>
<body class="profile-body">

<nav class="profile-nav">
  <a href="users.html" class="nav-back">← 名片广场</a>
  <span class="nav-title">电子名片</span>
  <a href="#" class="nav-logout" id="logoutBtn" style="display:none;" onclick="doLogout(); return false;">退出登录</a>
</nav>

<div class="profile-wrap">
  <aside class="profile-sidebar">
    <div class="sidebar-card">
      <div class="sidebar-avatar-wrap">
        <img id="avatar" class="sidebar-avatar" src="" alt="头像">
        <div class="sidebar-status"></div>
      </div>
      <h1 id="name" class="sidebar-name">加载中...</h1>
      <p id="job" class="sidebar-job"></p>
      <div class="sidebar-divider"></div>
      <div class="sidebar-meta">
        <div class="meta-row">
          <span class="meta-label">用户 ID</span>
          <span class="meta-value" id="userId">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">注册时间</span>
          <span class="meta-value" id="joinDate">—</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="profile-main">
    <div class="welcome-bar" id="welcomeBar" style="display:none;">
      <span class="welcome-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/></svg></span>
      <span class="welcome-text" id="welcomeText">欢迎回来！</span>
    </div>

    <section class="info-block block-quote">
      <div class="block-header">
        <span class="block-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/></svg></span>
        <span class="block-title">个人简介</span>
      </div>
      <div class="block-body">
        <p id="intro" class="quote-text">这位用户还没有填写个人介绍...</p>
      </div>
    </section>

    <section class="info-block block-quote" id="honorBlock" style="display:none;">
      <div class="block-header">
        <span class="block-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="m8.5 13-1.5 7 5-2.5 5 2.5-1.5-7"/></svg></span>
        <span class="block-title">个人荣誉</span>
      </div>
      <div class="block-body">
        <p id="honorText" class="quote-text" style="display:none;"></p>
        <div id="honorImgContainer"></div>
      </div>
    </section>

    <section class="info-block block-contact">
      <div class="block-header">
        <span class="block-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span class="block-title">联系方式</span>
      </div>
      <div class="block-body">
        <div class="contact-grid">
          <a id="phoneLink" class="contact-box" href="#">
            <div class="contact-box-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5.5 5.5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z"/></svg></div>
            <div class="contact-box-label">电话</div>
            <div class="contact-box-value" id="phoneVal">未填写</div>
          </a>
          <a id="emailLink" class="contact-box" href="#">
            <div class="contact-box-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg></div>
            <div class="contact-box-label">邮箱</div>
            <div class="contact-box-value" id="emailVal">未填写</div>
          </a>
          <a id="githubLink" class="contact-box" href="#">
            <div class="contact-box-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8.5 8.5-4 3.5 4 3.5M15.5 8.5l4 3.5-4 3.5M13.5 5.5l-3 13"/></svg></div>
            <div class="contact-box-label">GitHub</div>
            <div class="contact-box-value" id="githubVal">未填写</div>
          </a>
        </div>
      </div>
    </section>

    <section class="info-block block-action" id="actionBlock" style="display:none;">
      <div class="block-header">
        <span class="block-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></span>
        <span class="block-title">管理操作</span>
      </div>
      <div class="block-body action-body-compact">
        <div class="action-mini-row">
          <span class="action-mini-label">编辑资料</span>
          <button onclick="edit()" class="action-mini-btn action-mini-btn-primary">编辑</button>
        </div>
        <div class="action-mini-row">
          <span class="action-mini-label">修改密码</span>
          <button onclick="changePassword()" class="action-mini-btn action-mini-btn-secondary">修改</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="pwdModal" class="modal-overlay">
  <div class="modal-content">
    <h3>修改密码</h3>
    <input type="password" id="oldPwd" placeholder="请输入原密码">
    <input type="password" id="newPwd" placeholder="请输入新密码">
    <input type="password" id="confirmPwd" placeholder="确认新密码">
    <div class="modal-buttons">
      <button onclick="submitChangePassword()">确认修改</button>
      <button class="secondary" onclick="closePwdModal()">取消</button>
    </div>
  </div>
</div>

<div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="查看大图">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
  <img id="lightboxImg" src="" alt="荣誉图片大图">
</div>

<script type="module">
import { supabase } from "./supabase.js";

let isOwner = false;

const lightbox = document.getElementById("imageLightbox");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxClose = document.getElementById("lightboxClose");

function closeLightbox(){
    lightbox.classList.remove("is-open");
    lightboxImg.src = "";
}

if(lightboxClose){
    lightboxClose.addEventListener("click", closeLightbox);
}
if(lightbox){
    lightbox.addEventListener("click", (event) => {
        if(event.target === lightbox) closeLightbox();
    });
}
document.addEventListener("keydown", (event) => {
    if(event.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
});


const welcomeQuotes = [
  "欢迎回来，今天也是闪闪发光的一天 ✨",
  "嘿，你的名片正在帮你社交呢 👋",
  "好久不见，这次想更新点什么？ 🤔",
  "你的数字身份已就位，随时可以出发 🚀",
  "欢迎回家，这里的一切都是你的 🏠",
  "又见面了，今天有什么新故事？ 📖",
  "登录成功，你的名片比你还积极 😄",
  "欢迎回来，世界在等你的名片 🌍",
  "今日已登录，请查收你的数字名片 📇",
  "嘿，别来无恙，名片广场又热闹了 🎉"
];

function getRandomQuote() {
  return welcomeQuotes[Math.floor(Math.random() * welcomeQuotes.length)];
}

function truncate(str, len){
    if(!str) return "";
    return str.length > len ? str.slice(0, len) + "..." : str;
}

function renderHonorImages(honorData) {
    const container = document.getElementById("honorImgContainer");
    container.innerHTML = "";
    
    let images = [];
    if(!honorData) return;
    
    try {
        const parsed = JSON.parse(honorData);
        if(Array.isArray(parsed)){
            images = parsed;
        } else {
            images = [honorData];
        }
    } catch(e) {
        images = [honorData];
    }
    
    if(images.length === 0) return;
    
    const grid = document.createElement("div");
    grid.className = "honor-grid";
    
    images.forEach((src, idx) => {
        const img = document.createElement("img");
        img.className = "honor-img";
        img.src = src;
        img.alt = "荣誉图片 " + (idx + 1);
        img.onerror = function() { this.style.display = "none"; };
        img.addEventListener("click", () => {
            lightboxImg.src = src;
            lightboxImg.alt = "荣誉图片 " + (idx + 1);
            lightbox.classList.add("is-open");
        });
        grid.appendChild(img);
    });
    
    container.appendChild(grid);
}

(async function() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        let targetId = urlParams.get('id');

        if(!targetId){
            const { data: userData } = await supabase.auth.getUser();
            if(!userData.user){
                alert("请先登录");
                location.href = "index.html";
                return;
            }
            targetId = userData.user.id;
        }

        const { data, error } = await supabase
            .from("profiles")
            .select("*")
            .eq("id", targetId)
            .maybeSingle();

        if(error || !data){
            alert("名片不存在");
            location.href = "users.html";
            return;
        }

        if(data.avatar){
            document.getElementById("avatar").src = data.avatar;
        }
        document.getElementById("name").textContent = data.name || "未命名";
        document.getElementById("job").textContent = data.job || "暂无职位";
        document.getElementById("userId").textContent = (data.id || "").slice(0, 12) + "...";

        const introEl = document.getElementById("intro");
        if(data.intro && data.intro.trim()){
            introEl.textContent = data.intro;
            introEl.classList.remove("empty");
        } else {
            introEl.textContent = "这位用户还没有填写个人介绍...";
            introEl.classList.add("empty");
        }

        const phoneVal = document.getElementById("phoneVal");
        const phoneLink = document.getElementById("phoneLink");
        if(data.phone){
            phoneVal.textContent = data.phone;
            phoneLink.href = "tel:" + data.phone;
            phoneLink.classList.remove("disabled");
        } else {
            phoneVal.textContent = "未填写";
            phoneLink.classList.add("disabled");
            phoneLink.href = "#";
        }

        const emailVal = document.getElementById("emailVal");
        const emailLink = document.getElementById("emailLink");
        if(data.email){
            emailVal.textContent = data.email;
            emailLink.href = "mailto:" + data.email;
            emailLink.classList.remove("disabled");
        } else {
            emailVal.textContent = "未填写";
            emailLink.classList.add("disabled");
            emailLink.href = "#";
        }

        const githubVal = document.getElementById("githubVal");
        const githubLink = document.getElementById("githubLink");
        let safeGithub = "";
        if(data.github){
            try {
                const url = new URL(data.github);
                if(url.protocol === "https:" || url.protocol === "http:") safeGithub = url.href;
            } catch(e) {}
        }
        if(safeGithub){
            githubVal.textContent = truncate(data.github, 24);
            githubLink.href = safeGithub;
            githubLink.target = "_blank";
            githubLink.rel = "noopener noreferrer";
            githubLink.classList.remove("disabled");
        } else {
            githubVal.textContent = data.github ? truncate(data.github, 24) : "未填写";
            githubLink.removeAttribute("href");
            githubLink.removeAttribute("target");
            githubLink.removeAttribute("rel");
            githubLink.classList.add("disabled");
        }

        const honorBlock = document.getElementById("honorBlock");
        const honorTextEl = document.getElementById("honorText");
        
        if(data.honor_text || data.honor_image){
            honorBlock.style.display = "block";
            
            if(data.honor_text && data.honor_text.trim()){
                honorTextEl.textContent = data.honor_text;
                honorTextEl.style.display = "block";
            } else {
                honorTextEl.style.display = "none";
            }
            
            renderHonorImages(data.honor_image);
        }

        const { data: currentUser } = await supabase.auth.getUser();
        isOwner = currentUser.user && currentUser.user.id === targetId;

        const fromSquare = urlParams.has('id');

        if(isOwner && !fromSquare){
            document.getElementById("actionBlock").style.display = "block";
            document.getElementById("logoutBtn").style.display = "inline-flex";
            document.getElementById("welcomeBar").style.display = "flex";
            document.getElementById("welcomeText").textContent = getRandomQuote();

            if(currentUser.user && currentUser.user.created_at){
                const d = new Date(currentUser.user.created_at);
                document.getElementById("joinDate").textContent = 
                    d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
            }
        } else if (isOwner && fromSquare) {
            document.getElementById("logoutBtn").style.display = "inline-flex";
        }

    } catch(err) {
        console.error(err);
        alert("加载出错");
    }
})();

window.edit = function(){
    location.href = "profile.html";
};

window.changePassword = function(){
    document.getElementById("pwdModal").style.display = "flex";
};
window.closePwdModal = function(){
    document.getElementById("pwdModal").style.display = "none";
    document.getElementById("oldPwd").value = "";
    document.getElementById("newPwd").value = "";
    document.getElementById("confirmPwd").value = "";
};
window.submitChangePassword = async function(){
    const oldPwd = document.getElementById("oldPwd").value;
    const newPwd = document.getElementById("newPwd").value;
    const confirmPwd = document.getElementById("confirmPwd").value;

    if(!oldPwd || !newPwd || !confirmPwd){
        alert("请填写所有密码");
        return;
    }
    if(newPwd !== confirmPwd){
        alert("两次输入的新密码不一致");
        return;
    }
    if(newPwd.length < 6){
        alert("新密码至少6位");
        return;
    }

    const { data: userData } = await supabase.auth.getUser();
    if(!userData.user){
        alert("请先登录");
        return;
    }

    const { error: signInError } = await supabase.auth.signInWithPassword({
        email: userData.user.email,
        password: oldPwd
    });

    if(signInError){
        alert("原密码错误");
        return;
    }

    const { error: updateError } = await supabase.auth.updateUser({
        password: newPwd
    });

    if(updateError){
        alert("修改失败: " + updateError.message);
    } else {
        alert("密码修改成功，请重新登录");
        await supabase.auth.signOut();
        location.href = "index.html";
    }
};

window.doLogout = async function(){
    await supabase.auth.signOut();
    location.href = "index.html";
};
</script>
<script type="module" src="script.js"></script>
</body>
</html>
