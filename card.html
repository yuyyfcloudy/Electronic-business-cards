<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>我的电子名片</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="card">


<img id="avatar"
class="avatar"
src="images/avatar.jpg">



<h1 id="name">
加载中...
</h1>


<h3 id="job"></h3>



<p id="intro"></p>




<div class="buttons">


<a id="phone">

📞 电话

</a>


<a id="email">

✉ 邮箱

</a>



<a id="github">

💻 GitHub

</a>


</div>



<button onclick="edit()">

修改资料

</button>



</div>





<script type="module">


import { supabase }
from "./supabase.js";




// 获取登录用户

const {

data:userData

}=

await supabase.auth.getUser();



if(!userData.user){

alert("请先登录");

location.href="index.html";

}




// 查询用户资料

const {

data,

error

}=

await supabase

.from("profiles")

.select("*")

.eq(
"id",
userData.user.id
)

.single();





if(error || !data){

alert("还没有创建名片，请填写资料");

location.href = "profile.html";

return;

}

else{


// 显示头像

if(data.avatar){

document.getElementById("avatar")
.src=data.avatar;

}




document.getElementById("name")
.innerHTML=data.name;



document.getElementById("job")
.innerHTML=data.job;



document.getElementById("intro")
.innerHTML=data.intro;



document.getElementById("phone")
.href=
"tel:"+data.phone;



document.getElementById("email")
.href=
"mailto:"+data.email;



document.getElementById("github")
.href=data.github;



}





window.edit=function(){

location.href="profile.html";

}



</script>


</body>

</html>
