<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的电子名片</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="profile-body">

<nav class="profile-nav">
    <a href="users.html" class="nav-back">← 返回名片广场</a>
    <span class="nav-title">电子名片</span>
    <a id="logoutBtn" href="javascript:void(0)" class="nav-logout" onclick="doLogout()" style="display:none;">退出登录</a>
</nav>

<div class="profile-wrap" id="profileWrap">
    <div class="loading-state" style="width:100%;color:rgba(255,255,255,0.4);padding:80px 20px;text-align:center;">
        正在加载名片信息...
    </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const wrap = document.getElementById("profileWrap");
const logoutBtn = document.getElementById("logoutBtn");

function getQueryId() {
    const p = new URLSearchParams(window.location.search);
    const id = p.get("id");
    return id ? decodeURIComponent(id) : null;
}

function normalizeHiddenFields(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) return raw;
    if (typeof raw === 'string') {
        try { return JSON.parse(raw); } catch(e) { return []; }
    }
    return [];
}

function parseHonorImages(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) return raw.filter(x => x && typeof x === 'string');
    if (typeof raw === 'string') {
        try {
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr.filter(x => x && typeof x === 'string') : [raw];
        } catch(e) {
            return [raw];
        }
    }
    return [];
}

function truncate(str, len) {
    if (!str) return "";
    str = String(str);
    return str.length > len ? str.slice(0, len) + "..." : str;
}

window.doLogout = async function() {
    if (!confirm("确定要退出登录吗？")) return;
    await supabase.auth.signOut();
    location.href = "login.html";
};

function buildSidebar(user, isOwner, shouldHideField) {
    const aside = document.createElement("aside");
    aside.className = "profile-sidebar";

    const card = document.createElement("div");
    card.className = "sidebar-card";

    const avatarWrap = document.createElement("div");
    avatarWrap.className = "sidebar-avatar-wrap";

    const avatar = document.createElement("img");
    avatar.className = "sidebar-avatar";
    avatar.alt = "头像";
    if (user.avatar && typeof user.avatar === 'string' && user.avatar.trim()) {
        avatar.src = user.avatar.trim();
        avatar.onerror = function() { this.src = ""; this.style.background = "rgba(255,255,255,0.04)"; };
    } else {
        avatar.style.background = "rgba(255,255,255,0.04)";
    }

    const status = document.createElement("div");
    status.className = "sidebar-status";

    avatarWrap.appendChild(avatar);
    avatarWrap.appendChild(status);

    const name = document.createElement("h2");
    name.className = "sidebar-name";
    name.textContent = shouldHideField('name') ? "已隐藏" : (user.name || "未命名用户");

    const job = document.createElement("p");
    job.className = "sidebar-job";
    job.textContent = shouldHideField('job') ? "已隐藏" : (user.job || "暂无职位");

    const divider = document.createElement("div");
    divider.className = "sidebar-divider";

    const meta = document.createElement("div");
    meta.className = "sidebar-meta";

    const rows = [
        { label: "用户 ID", value: truncate(user.id, 16) },
        { label: "名片身份", value: isOwner ? "本人名片" : "他人名片" },
    ];

    if (!shouldHideField('name') && user.email) {
        rows.push({ label: "账户邮箱", value: truncate(user.email, 24) });
    }

    rows.forEach(r => {
        const row = document.createElement("div");
        row.className = "meta-row";
        const lb = document.createElement("span");
        lb.className = "meta-label";
        lb.textContent = r.label;
        const vl = document.createElement("span");
        vl.className = "meta-value";
        vl.textContent = r.value;
        row.appendChild(lb);
        row.appendChild(vl);
        meta.appendChild(row);
    });

    card.appendChild(avatarWrap);
    card.appendChild(name);
    card.appendChild(job);
    card.appendChild(divider);
    card.appendChild(meta);
    aside.appendChild(card);

    return aside;
}

function buildMain(user, isOwner, shouldHideField) {
    const main = document.createElement("main");
    main.className = "profile-main";

    if (isOwner) {
        const wb = document.createElement("div");
        wb.className = "welcome-bar";
        const icon = document.createElement("span");
        icon.className = "welcome-icon";
        icon.textContent = "👋";
        const txt = document.createElement("span");
        txt.className = "welcome-text";
        txt.textContent = "欢迎回来，这里是你的专属名片主页";
        wb.appendChild(icon);
        wb.appendChild(txt);
        main.appendChild(wb);
    }

    const introBlock = document.createElement("div");
    introBlock.className = "info-block block-quote";
    {
        const introHeader = document.createElement("div");
        introHeader.className = "block-header";
        const introIcon = document.createElement("span");
        introIcon.className = "block-icon";
        introIcon.textContent = "💭";
        const introTitle = document.createElement("span");
        introTitle.className = "block-title";
        introTitle.textContent = "个人简介";
        introHeader.appendChild(introIcon);
        introHeader.appendChild(introTitle);

        const introBody = document.createElement("div");
        introBody.className = "block-body";
        const introText = document.createElement("p");
        introText.className = "quote-text";
        if (shouldHideField('intro')) {
            introText.classList.add("empty");
            introText.textContent = "该用户已隐藏个人介绍";
        } else if (user.intro && String(user.intro).trim()) {
            introText.textContent = String(user.intro).trim();
        } else {
            introText.classList.add("empty");
            introText.textContent = "这位用户还没有填写个人介绍~";
        }
        introBody.appendChild(introText);

        introBlock.appendChild(introHeader);
        introBlock.appendChild(introBody);
    }

    const honorBlock = document.createElement("div");
    honorBlock.className = "info-block";
    {
        const hdr = document.createElement("div");
        hdr.className = "block-header";
        const hi = document.createElement("span");
        hi.className = "block-icon";
        hi.textContent = "🏆";
        const ht = document.createElement("span");
        ht.className = "block-title";
        ht.textContent = "荣誉展示";
        hdr.appendChild(hi);
        hdr.appendChild(ht);

        const hBody = document.createElement("div");
        hBody.className = "block-body";
        hBody.style.paddingLeft = "12px";

        const honorImages = parseHonorImages(user.honor_image);
        const honorTextHidden = shouldHideField('honor_text');
        const honorImgHidden = shouldHideField('honor_image');

        let hasContent = false;

        if (!honorTextHidden && user.honor_text && String(user.honor_text).trim()) {
            const q = document.createElement("blockquote");
            q.className = "quote-text";
            q.style.margin = "0 0 16px 0";
            q.style.paddingLeft = "16px";
            q.style.borderLeft = "3px solid rgba(139,92,246,0.3)";
            q.style.color = "rgba(255,255,255,0.6)";
            q.style.lineHeight = "1.8";
            q.textContent = String(user.honor_text).trim();
            hBody.appendChild(q);
            hasContent = true;
        } else if (honorTextHidden) {
            const q = document.createElement("blockquote");
            q.className = "quote-text empty";
            q.style.margin = "0 0 16px 0";
            q.style.paddingLeft = "16px";
            q.style.borderLeft = "3px solid rgba(139,92,246,0.3)";
            q.textContent = "该用户已隐藏荣誉文字";
            hBody.appendChild(q);
        }

        if (!honorImgHidden && honorImages.length > 0) {
            const imgWrap = document.createElement("div");
            imgWrap.className = "honor-grid";
            honorImages.forEach(src => {
                const img = document.createElement("img");
                img.className = "honor-img";
                img.src = src;
                img.alt = "荣誉图片";
                img.loading = "lazy";
                img.onclick = () => window.open(src, "_blank");
                img.onerror = function() { this.style.display = "none"; };
                imgWrap.appendChild(img);
            });
            hBody.appendChild(imgWrap);
            hasContent = true;
        } else if (honorImgHidden) {
            const p = document.createElement("p");
            p.className = "quote-text empty";
            p.style.fontStyle = "italic";
            p.textContent = "该用户已隐藏荣誉图片";
            hBody.appendChild(p);
        }

        if (!hasContent) {
            const p = document.createElement("p");
            p.className = "quote-text empty";
            p.style.fontStyle = "italic";
            p.textContent = "这位用户还没有添加荣誉信息~";
            hBody.appendChild(p);
        }

        honorBlock.appendChild(hdr);
        honorBlock.appendChild(hBody);
    }

    const contactBlock = document.createElement("div");
    contactBlock.className = "info-block block-contact";
    {
        const contactHeader = document.createElement("div");
        contactHeader.className = "block-header";
        const cIcon = document.createElement("span");
        cIcon.className = "block-icon";
        cIcon.textContent = "📡";
        const cTitle = document.createElement("span");
        cTitle.className = "block-title";
        cTitle.textContent = "联系方式";
        contactHeader.appendChild(cIcon);
        contactHeader.appendChild(cTitle);

        const contactBody = document.createElement("div");
        contactBody.className = "block-body";
        const grid = document.createElement("div");
        grid.className = "contact-grid";

        const contactDefs = [
            { key: "phone",  icon: "📞", label: "电话",   href: (v) => "tel:" + v },
            { key: "email",  icon: "✉️", label: "邮箱",   href: (v) => "mailto:" + v },
            { key: "github", icon: "💻", label: "GitHub", href: (v) => (v.startsWith("http") ? v : "https://" + v) },
        ];

        contactDefs.forEach(def => {
            const box = document.createElement("a");
            box.className = "contact-box";
            const val = user[def.key];
            const hidden = shouldHideField(def.key);

            if (hidden) {
                box.classList.add("disabled");
                box.removeAttribute("href");
            } else if (val && String(val).trim()) {
                box.href = def.href(String(val).trim());
                box.target = (def.key === 'github') ? "_blank" : "_self";
                box.rel = "noopener noreferrer";
            } else {
                box.classList.add("disabled");
                box.removeAttribute("href");
            }

            const ic = document.createElement("div");
            ic.className = "contact-box-icon";
            ic.textContent = def.icon;

            const lb = document.createElement("div");
            lb.className = "contact-box-label";
            lb.textContent = def.label;

            const vl = document.createElement("div");
            vl.className = "contact-box-value";
            if (hidden) {
                vl.textContent = "已隐藏";
            } else if (val && String(val).trim()) {
                vl.textContent = truncate(String(val).trim(), 28);
            } else {
                vl.textContent = "未填写";
            }

            box.appendChild(ic);
            box.appendChild(lb);
            box.appendChild(vl);
            grid.appendChild(box);
        });

        contactBody.appendChild(grid);
        contactBlock.appendChild(contactHeader);
        contactBlock.appendChild(contactBody);
    }

    let actionBlock = null;
    if (isOwner) {
        actionBlock = document.createElement("div");
        actionBlock.className = "info-block block-action";

        const actHeader = document.createElement("div");
        actHeader.className = "block-header";
        const aIc = document.createElement("span");
        aIc.className = "block-icon";
        aIc.textContent = "⚙️";
        const aTt = document.createElement("span");
        aTt.className = "block-title";
        aTt.textContent = "管理操作";
        actHeader.appendChild(aIc);
        actHeader.appendChild(aTt);

        const actBody = document.createElement("div");
        actBody.className = "action-body-compact";

        const actions = [
            { label: "✏️ 编辑资料",  cls: "primary",   click: () => { location.href = "profile.html"; } },
            { label: "📇 名片广场",  cls: "secondary", click: () => { location.href = "users.html"; } },
        ];

        actions.forEach(ac => {
            const row = document.createElement("div");
            row.className = "action-mini-row";
            const lb = document.createElement("span");
            lb.className = "action-mini-label";
            lb.textContent = "操作";
            const btn = document.createElement("button");
            btn.className = "action-mini-btn action-mini-btn-" + ac.cls;
            btn.textContent = ac.label;
            btn.onclick = ac.click;
            row.appendChild(lb);
            row.appendChild(btn);
            actBody.appendChild(row);
        });

        actionBlock.appendChild(actHeader);
        actionBlock.appendChild(actBody);
    }

    main.appendChild(introBlock);
    main.appendChild(honorBlock);
    main.appendChild(contactBlock);
    if (actionBlock) main.appendChild(actionBlock);

    return main;
}

function renderEmpty(text, icon = "📇") {
    wrap.innerHTML =
        '<div class="empty-state" style="width:100%;padding:80px 20px;text-align:center;">' +
            '<div class="empty-state-icon" style="font-size:48px;margin-bottom:16px;opacity:0.3;">' + icon + '</div>' +
            '<div class="empty-state-text" style="color:rgba(255,255,255,0.4);font-size:16px;">' + text + '</div>' +
        '</div>';
}

async function bootstrap() {
    const queryId = getQueryId();
    const { data: authData } = await supabase.auth.getUser();
    const currentUser = authData.user || null;

    if (currentUser) {
        logoutBtn.style.display = "inline-block";
    }

    let targetId = queryId || (currentUser ? currentUser.id : null);

    if (!targetId) {
        renderEmpty("请先<a href='login.html' style='color:#a78bfa;text-decoration:none;'>登录</a>查看你的名片，或从<a href='users.html' style='color:#a78bfa;text-decoration:none;'>名片广场</a>选择一张名片查看。", "🔒");
        return;
    }

    const isOwner = currentUser && currentUser.id === targetId;

    const { data: user, error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", targetId)
        .maybeSingle();

    if (error) {
        renderEmpty("加载失败：" + error.message, "⚠️");
        return;
    }

    if (!user) {
        if (isOwner) {
            renderEmpty("你还没有创建名片，<a href='profile.html' style='color:#a78bfa;text-decoration:none;'>点击这里填写资料</a>创建第一张吧！", "✨");
        } else {
            renderEmpty("该用户的名片不存在或已被删除", "❓");
        }
        return;
    }

    if (!isOwner && (user.is_hidden === true || user.is_hidden === "true")) {
        renderEmpty("该用户已隐藏整张名片", "🙈");
        return;
    }

    const hiddenFields = normalizeHiddenFields(user.hidden_fields);
    const shouldHideField = (field) => hiddenFields.includes(field) && !isOwner;

    wrap.innerHTML = "";
    const sidebar = buildSidebar(user, isOwner, shouldHideField);
    const main = buildMain(user, isOwner, shouldHideField);
    wrap.appendChild(sidebar);
    wrap.appendChild(main);

    if (isOwner) {
        document.title = (user.name ? user.name + " - " : "") + "我的电子名片";
    } else {
        document.title = (user.name ? user.name + " - " : "") + "电子名片";
    }
}

bootstrap();
</script>

</body>
</html>
