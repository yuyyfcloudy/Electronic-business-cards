<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的电子名片</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
<img id="avatar" class="avatar" src="images/avatar.jpg" alt="头像">
<h1 id="name">加载中...</h1>
<h3 id="job"></h3>
<p id="intro"></p>

<div class="buttons">
<a id="phone">📞 电话</a>
<a id="email">✉ 邮箱</a>
<a id="github">💻 GitHub</a>
</div>

<button onclick="edit()" id="editBtn">修改资料</button>
<button onclick="changePassword()" id="pwdBtn" style="margin-left:10px;background:#52c41a;">修改密码</button>
</div>

<!-- 修改密码弹窗 -->
<div id="pwdModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:100;">
  <div style="background:white;padding:30px;border-radius:15px;width:320px;text-align:center;">
    <h3 style="margin-top:0;">修改密码</h3>
    <input type="password" id="oldPwd" placeholder="请输入原密码" style="width:90%;padding:12px;margin:8px;border-radius:10px;border:1px solid #ddd;">
    <input type="password" id="newPwd" placeholder="请输入新密码" style="width:90%;padding:12px;margin:8px;border-radius:10px;border:1px solid #ddd;">
    <input type="password" id="confirmPwd" placeholder="确认新密码" style="width:90%;padding:12px;margin:8px;border-radius:10px;border:1px solid #ddd;">
    <div style="margin-top:15px;">
      <button onclick="submitChangePassword()" style="padding:10px 20px;border:none;background:#1677ff;color:white;border-radius:10px;cursor:pointer;margin-right:10px;">确认</button>
      <button onclick="closePwdModal()" style="padding:10px 20px;border:none;background:#ccc;color:#333;border-radius:10px;cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

(async function() {
    try {
        // ========== 关键改动 1：从 URL 获取用户 ID ==========
        const urlParams = new URLSearchParams(window.location.search);
        let targetId = urlParams.get('id');
        
        // 如果 URL 没有 id 参数，查当前登录用户
        if(!targetId){
            const { data: userData } = await supabase.auth.getUser();
            if(!userData.user){
                alert("请先登录");
                location.href = "index.html";
                return;
            }
            targetId = userData.user.id;
        }
        
        // ========== 关键改动 2：查询名片（匿名也能查）==========
        const { data, error } = await supabase
            .from("profiles")
            .select("*")
            .eq("id", targetId)
            .maybeSingle();
        
        if(error || !data){
            alert("名片不存在");
            location.href = "users.html";
            return;
        }
        
        // 显示资料（和之前一样）
        if(data.avatar){
            document.getElementById("avatar").src = data.avatar;
        }
        document.getElementById("name").textContent = data.name || "";
        document.getElementById("job").textContent = data.job || "";
        document.getElementById("intro").textContent = data.intro || "";
        
        if(data.phone){
            document.getElementById("phone").href = "tel:" + data.phone;
        }
        if(data.email){
            document.getElementById("email").href = "mailto:" + data.email;
        }
        if(data.github){
            document.getElementById("github").href = data.github;
        }
	// 判断是否是看自己的名片，不是就隐藏编辑按钮
	const { data: currentUser } = await supabase.auth.getUser();
	if(targetId && (!currentUser.user || currentUser.user.id !== targetId)){
	    document.getElementById("editBtn").style.display = "none";
	    document.getElementById("pwdBtn").style.display = "none";
	}
	

        // ========== 关键改动 3：看别人的名片时隐藏编辑按钮 ==========
        const { data: currentUser } = await supabase.auth.getUser();
        if(targetId && (!currentUser.user || currentUser.user.id !== targetId)){
            document.querySelector('button[onclick="edit()"]').style.display = "none";
            const pwdBtn = document.querySelector('button[onclick="changePassword()"]');
            if(pwdBtn) pwdBtn.style.display = "none";
        }

    } catch(err) {
        console.error(err);
        alert("加载出错");
    }
})();

window.edit = function(){
    location.href = "profile.html";
};

// 保留你之前的改密码代码（如果有的话）
window.changePassword = function(){
    document.getElementById("pwdModal").style.display = "flex";
};
window.closePwdModal = function(){
    document.getElementById("pwdModal").style.display = "none";
    document.getElementById("oldPwd").value = "";
    document.getElementById("newPwd").value = "";
    document.getElementById("confirmPwd").value = "";
};
window.submitChangePassword = async function(){
    const oldPwd = document.getElementById("oldPwd").value;
    const newPwd = document.getElementById("newPwd").value;
    const confirmPwd = document.getElementById("confirmPwd").value;
    
    if(!oldPwd || !newPwd || !confirmPwd){
        alert("请填写所有密码");
        return;
    }
    if(newPwd !== confirmPwd){
        alert("两次输入的新密码不一致");
        return;
    }
    if(newPwd.length < 6){
        alert("新密码至少6位");
        return;
    }
    
    const { data: userData } = await supabase.auth.getUser();
    if(!userData.user){
        alert("请先登录");
        return;
    }
    
    const { error: signInError } = await supabase.auth.signInWithPassword({
        email: userData.user.email,
        password: oldPwd
    });
    
    if(signInError){
        alert("原密码错误");
        return;
    }
    
    const { error: updateError } = await supabase.auth.updateUser({
        password: newPwd
    });
    
    if(updateError){
        alert("修改失败: " + updateError.message);
    } else {
        alert("密码修改成功，请重新登录");
        await supabase.auth.signOut();
        location.href = "index.html";
    }
};
</script>
</body>
</html>
