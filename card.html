<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>我的电子名片</title>

<link rel="stylesheet" href="style.css">

</head>



<body>


<div class="card">



<img id="avatar"
class="avatar">



<h1 id="name"></h1>


<h3 id="job"></h3>



<p id="intro"></p>




<div class="buttons">


<a id="phone">

📞 电话

</a>


<a id="email">

✉ 邮箱

</a>



<a id="github">

💻 GitHub

</a>


</div>



<button onclick="edit()">

修改资料

</button>



</div>




<script>


let data=
JSON.parse(
localStorage.getItem("card")
);



document.getElementById("avatar")
.src=data.avatar;



document.getElementById("name")
.innerHTML=data.name;



document.getElementById("job")
.innerHTML=data.job;



document.getElementById("intro")
.innerHTML=data.intro;



document.getElementById("phone")
.href="tel:"+data.phone;



document.getElementById("email")
.href="mailto:"+data.email;



document.getElementById("github")
.href=data.github;



function edit(){

location.href="index.html";

}


</script>


</body>

</html>
