<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的电子名片</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
<img id="avatar" class="avatar" src="images/avatar.jpg" alt="头像">
<h1 id="name">加载中...</h1>
<h3 id="job"></h3>
<p id="intro"></p>

<div class="buttons">
<a id="phone">📞 电话</a>
<a id="email">✉ 邮箱</a>
<a id="github">💻 GitHub</a>
</div>

<button onclick="edit()">修改资料</button>
</div>

<script type="module">
import { supabase } from "./supabase.js";

(async function() {
    try {
        const { data: userData } = await supabase.auth.getUser();
        
        if (!userData.user) {
            alert("请先登录");
            location.href = "index.html";
            return;
        }
        
        const { data, error } = await supabase
            .from("profiles")
            .select("*")
            .eq("id", userData.user.id)
            .maybeSingle();
        
        if (error || !data) {
            alert("还没有创建名片，请填写资料");
            location.href = "profile.html";
            return;
        }
        
        // 显示头像
        if (data.avatar) {
            document.getElementById("avatar").src = data.avatar;
        }
        
        document.getElementById("name").textContent = data.name || "";
        document.getElementById("job").textContent = data.job || "";
        document.getElementById("intro").textContent = data.intro || "";
        
        if (data.phone) {
            document.getElementById("phone").href = "tel:" + data.phone;
        }
        if (data.email) {
            document.getElementById("email").href = "mailto:" + data.email;
        }
        if (data.github) {
            document.getElementById("github").href = data.github;
        }

    } catch (err) {
        console.error(err);
        alert("加载出错");
    }
})();

window.edit = function(){
    location.href = "profile.html";
}
</script>

</body>
</html>
