<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>注册账号</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="box">
<h1>🚀 创建账号</h1>
<p style="margin-bottom:25px;color:#888;">开启你的电子名片之旅</p>
<input id="email" type="email" placeholder="请输入邮箱">
<input id="password" type="password" placeholder="请输入密码（至少6位）">
<input id="confirmPassword" type="password" placeholder="请确认密码">
<button onclick="register()">注 册</button>
<p>已有账号？<a href="index.html">去登录</a></p>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
