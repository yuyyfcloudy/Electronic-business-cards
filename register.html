<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>注册账号</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>
创建账号
</h1>


<input 
id="email"
type="email"
placeholder="请输入邮箱">


<input
id="password"
type="password"
placeholder="请输入密码">

<input
id="confirmPassword"
type="password"
placeholder="请确认密码">


<button onclick="register()">

注册

</button>


<p>

已有账号？

<a href="index.html">
去登录
</a>

</p>


</div>



<script 
type="module"
src="script.js">
</script>


</body>

</html>
