<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子名片系统</title>
<link rel="stylesheet" href="style.css">
<style>
/* ========== 引导页专属样式 ========== */
.landing-body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    position: relative;
}

/* ========== 真实视频背景 ========== */
.landing-video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: #000;
}

.landing-video-bg video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    opacity: 0.85;
}

/* 视频上方暗色遮罩，保证文字可读 */
.landing-video-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(
        180deg,
        rgba(6, 8, 20, 0.35) 0%,
        rgba(6, 8, 20, 0.15) 40%,
        rgba(6, 8, 20, 0.35) 100%
    );
}

/* 中央光晕呼吸 */
.landing-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 800px;
    height: 800px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 2;
    animation: glowPulse 6s ease-in-out infinite;
}

@keyframes glowPulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
}

/* 浮动粒子 */
.landing-particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.landing-particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(167, 139, 250, 0.12);
    animation: particleFloat linear infinite;
}

@keyframes particleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* 中央内容区 */
.landing-center {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
    padding: 40px;
}

/* Logo 图标 */
.landing-logo {
    font-size: 72px;
    line-height: 1;
    margin-bottom: 28px;
    display: inline-block;
    opacity: 0;
    transform: scale(0.7) translateY(20px);
    animation: logoReveal 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards;
    filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
}

@keyframes logoReveal {
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* 品牌名 */
.landing-brand {
    font-size: 13px;
    font-weight: 600;
    color: rgba(167, 139, 250, 0.6);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.7s forwards;
}

/* 主标题 */
.landing-title {
    font-size: 42px;
    font-weight: 800;
    color: #f1f5f9;
    margin: 0 0 16px 0;
    letter-spacing: -1px;
    line-height: 1.2;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards;
}

/* 副标题 */
.landing-subtitle {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.4);
    margin: 0 0 40px 0;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.1s forwards;
}

/* 分隔线 */
.landing-divider {
    width: 48px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.5), transparent);
    margin: 0 auto 40px;
    border-radius: 1px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.3s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* 进入按钮 */
.landing-enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 48px;
    background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 24px rgba(124, 58, 237, 0.3);
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    animation: btnReveal 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.5s forwards;
    transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.landing-enter-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 32px rgba(124, 58, 237, 0.45);
    filter: brightness(1.1);
}

.landing-enter-btn:active {
    transform: translateY(0) scale(0.98);
}

@keyframes btnReveal {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* 箭头图标 */
.landing-arrow {
    transition: transform 0.3s ease;
}

.landing-enter-btn:hover .landing-arrow {
    transform: translateX(4px);
}

/* 自动跳转提示 */
.landing-hint {
    margin-top: 28px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.2);
    opacity: 0;
    animation: fadeIn 0.6s ease 2s forwards;
}

.landing-hint span {
    color: rgba(167, 139, 250, 0.5);
    font-weight: 500;
}

/* 进度条 */
.landing-progress {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    width: 0%;
    animation: progressFill 13s linear 2s forwards;
    z-index: 10;
}

@keyframes progressFill {
    to { width: 100%; }
}

@media (max-width: 600px) {
    .landing-title {
        font-size: 32px;
    }
    .landing-subtitle {
        font-size: 15px;
    }
    .landing-logo {
        font-size: 56px;
    }
    .landing-center {
        padding: 24px;
    }
}
</style>
<base target="_blank">
<base target="_blank">
</head>
<body class="landing-body">

<!-- 真实星空视频背景 -->
<div class="landing-video-bg">
    <video autoplay muted loop playsinline preload="auto">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4">
    </video>
</div>
<div class="landing-video-overlay"></div>
<div class="landing-glow"></div>

<!-- 浮动粒子 -->
<div class="landing-particles" id="landingParticles"></div>


<!-- 中央内容 -->
<div class="landing-center">
    <div class="landing-logo">📇</div>
    <div class="landing-brand">Digital Business Card</div>
    <h1 class="landing-title">电子名片系统</h1>
    <p class="landing-subtitle">连接每一次相遇，让专业形象触手可及</p>
    <div class="landing-divider"></div>
    <a href="index.html" class="landing-enter-btn" onclick="goToLogin(event)">
        进入系统
        <span class="landing-arrow">→</span>
    </a>
    <p class="landing-hint"><span id="countdown">13</span> 秒后自动进入登录页面</p>
</div>

<!-- 底部进度条 -->
<div class="landing-progress" id="progressBar"></div>

<script>
// 生成浮动粒子
const particleContainer = document.getElementById("landingParticles");
for (let i = 0; i < 30; i++) {
    const p = document.createElement("div");
    p.className = "landing-particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.width = (Math.random() * 3 + 1) + "px";
    p.style.height = p.style.width;
    p.style.animationDuration = (Math.random() * 12 + 8) + "s";
    p.style.animationDelay = (Math.random() * 8) + "s";
    particleContainer.appendChild(p);
}

// 倒计时与自动跳转
let seconds = 13;
const countdownEl = document.getElementById("countdown");
const timer = setInterval(() => {
    seconds--;
    if (countdownEl) countdownEl.textContent = seconds;
    if (seconds <= 0) {
        clearInterval(timer);
        goToLogin();
    }
}, 1000);

// 4秒后强制跳转（兜底）
const autoRedirect = setTimeout(() => {
    goToLogin();
}, 14500);

function goToLogin(e) {
    if (e) e.preventDefault();
    clearInterval(timer);
    clearTimeout(autoRedirect);
    // 淡出效果
    document.body.style.transition = "opacity 0.5s ease";
    document.body.style.opacity = "0";
    setTimeout(() => {
        window.location.href = "index.html";
    }, 500);
}
</script>

</body>
</html>
